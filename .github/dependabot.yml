version: 2
updates:
  # Root npm package (server + CLI)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development

  # VS Code extension package
  - package-ecosystem: npm
    directory: "/vscode-extension"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions versions (checkout, setup-node, codeql, …)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
