name: Release

# Cut a release by pushing a version tag:
#   npm version <patch|minor|major> && git push --follow-tags
# (or tag manually: git tag -a v1.2.0 -m v1.2.0 && git push origin v1.2.0)

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm provenance + OIDC "trusted publishing"

jobs:
  npm:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # OIDC trusted publishing + provenance need a recent npm.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify all manifests match the release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/verify-manifests.js "$REF_NAME"

      - name: Publish to npm (with provenance)
        # Works tokenlessly once npm "Trusted Publishing" is configured for this repo
        # at npmjs.com -> llmboard -> Settings. Alternatively set an NPM_TOKEN repo
        # secret to an *automation* token (automation tokens bypass 2FA; classic
        # tokens with 2FA-on-publish will fail in CI).
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release create "$REF_NAME" --generate-notes --verify-tag

  extension:
    name: Publish VS Code extension
    runs-on: ubuntu-latest
    needs: npm
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install extension deps
        run: cd vscode-extension && npm ci

      - name: Package extension
        run: cd vscode-extension && npx --yes @vscode/vsce package -o extension.vsix

      # Each step runs only if its token secret is configured, so a missing
      # marketplace credential skips (not fails) the release.
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: cd vscode-extension && npx --yes @vscode/vsce publish --packagePath extension.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: env.OVSX_TOKEN != ''
        run: cd vscode-extension && npx --yes ovsx publish extension.vsix -p "$OVSX_TOKEN"
